<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>機電自檢紀錄表</title>
  <meta name="theme-color" content="#2f3446" />
  <meta name="author" content="Yimei" />
  <meta name="copyright" content="© 2026 Yimei. All rights reserved." />
  <script src="js/guard.js"></script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="機電自檢" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/yimei.css" />
  <link rel="stylesheet" href="css/cover.css" />
</head>
<body>
  <section class="yc" id="cover" hidden>
    <header class="yc-hero">
      <p class="yc-date" id="cvDate"></p>
      <p class="yc-hello"><span id="cvGreet">你好</span>，Yimei ☀️</p>
      <h1 class="yc-name">Yimei 的<br />工地手帳</h1>
      <p class="yc-tag">機電自檢・水電清查・沒網路也能用</p>
    </header>
    <div class="yc-body">
      <h2 class="yc-h">今天要做什麼呢</h2>
      <div class="yc-tools">
        <a class="yc-tool yc-lav" href="#/self-check" id="cvSelfCheck">
          <span class="yc-ic" aria-hidden="true">📋</span>
          <span class="yc-txt"><b>自主檢查表</b><small>勾選・簽名・輸出 PDF</small></span>
          <span class="yc-go" aria-hidden="true">›</span>
        </a>
        <a class="yc-tool yc-pink" href="water/">
          <span class="yc-ic" aria-hidden="true">🔌</span>
          <span class="yc-txt"><b>水電清查</b><small>A～H 棟逐層逐間・缺失追蹤・PDF</small></span>
          <span class="yc-go" aria-hidden="true">›</span>
        </a>
        <a class="yc-tool yc-lav" href="donggang/">
          <span class="yc-ic" aria-hidden="true">🔒</span>
          <span class="yc-txt"><b>工地機電清查</b><small>需要工地密碼</small></span>
          <span class="yc-go" aria-hidden="true">›</span>
        </a>
      </div>
      <p class="yc-foot">資料只存在這台手機・換手機前記得先備份</p>
      <button class="yc-owner" id="cvOwner" type="button" hidden>🔒 管理者登入</button>
    </div>
    <script>
      (function () {
        var d = new Date(), h = d.getHours();
        document.getElementById('cvGreet').textContent = h < 11 ? '早安' : h < 14 ? '午安' : h < 18 ? '午後好' : '晚安';
        var w = '日一二三四五六'.charAt(d.getDay());
        document.getElementById('cvDate').textContent = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日（' + w + '）';
      })();
    </script>
  </section>

  <header class="ol-bar" id="olBar" hidden>
    <a class="ol-brand" href="#/" title="回到封面">
      <img class="ol-logo" src="icons/brand.png" alt="" width="34" height="34" />
      <div>
        <div class="ol-title">自主檢查表</div>
        <div class="ol-sub">機電自檢紀錄表</div>
      </div>
    </a>
    <label class="ol-project">
      <span>工地：</span>
      <select id="olProject" aria-label="目前工地"></select>
    </label>
    <button class="ol-btn" id="olManage" title="公司名稱；新增、改名、刪除工地">✎ 工地</button>
    <button class="ol-btn" id="olBackup" title="匯出或匯入備份">💾 備份</button>
    <button class="ol-btn ol-lock" id="olLock" title="同事模式：只能填表；輸入管理密碼可解鎖" hidden>🔒 同事模式</button>
    <span class="ol-status" id="olStatus" hidden></span>
  </header>
  <div class="ol-remind" id="olRemind" hidden>
    <span id="olRemindText"></span>
    <button class="ol-btn" data-remind="backup">💾 立即備份</button>
    <button class="ol-remind-later" data-remind="later">稍後</button>
  </div>

  <main class="ol-content" id="content" hidden><div class="sk-empty">載入中…</div></main>

  <dialog class="sk-dialog pj-dialog" id="olDialog"></dialog>
  <dialog class="sk-dialog tp-dialog" id="olTpl"></dialog>
  <input type="file" id="olImportFile" accept=".json,application/json" hidden />

  <script>
    // 共用的自主檢查表畫面（js/pages/self-check.js）用 registerPage 註冊
    window.PAGES = {};
    function registerPage(id, def) { window.PAGES[id] = def; }
  </script>
  <script src="js/owner.js"></script>
  <script src="js/owner-lock.js"></script>
  <script src="offline-store.js"></script>
  <script src="js/pages/self-check-print.js"></script>
  <script src="js/pages/self-check.js"></script>
  <script src="js/app-shell.js"></script>
</body>
</html>
